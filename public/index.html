<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>学習タイマー・復習・模試Web</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main data-product-root="study-timer-review-mockexam-web" class="shell">
    <header class="topbar">
      <div>
        <h1>学習タイマー・復習・模試Web</h1>
        <p>学習タイマー、復習キュー、模試フローを静的Webでまとめる</p>
      </div>
      <button id="run-review" type="button">レビュー実行</button>
    </header>
    <section class="workspace">
      <div class="panel">
        <h2>代表シナリオ</h2>
        <ul id="scenario-list"></ul>
      </div>
      <div class="panel">
        <h2>次アクション</h2>
        <p id="next-action">今日の学習タイマーから次回復習と模試予定を作る</p>
        <output id="result">未実行</output>
      </div>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
